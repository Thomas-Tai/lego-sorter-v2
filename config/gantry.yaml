# Gantry Configuration for LEGO Sorter V2
# Controls ESP32 UART communication and motion parameters

gantry:
  serial:
    port: "/dev/ttyUSB0"     # ESP32 UART (Pi)
    baud_rate: 115200
    timeout_s: 5.0           # per-command timeout
    retry_count: 2

  motion:
    x_max_mm: 355.0
    y_max_mm: 160.0
    feed_rate_mm_min: 3000   # = 50 mm/s default
    homing_required: true

  servo:
    open_angle_us: 2500
    close_angle_us: 500
    gate_hold_ms: 300

  simulation:
    enabled: false           # override with --simulate CLI flag
    move_delay_s: 0.1        # simulated move time

  # Pickup/handoff position (spec.md §5.1/§5.2 PickupConfig(x, y position)).
  # SM-DES-004 §2.2b: conveyor chute outlet X=0 = gantry home, so pickup
  # coincides with home in the MVP design. No current code path reads this
  # yet (see PickupConfig docstring in sorter_app/domain/schemas.py) --
  # config/schema groundwork only, values UNVERIFIED against real hardware.
  pickup:
    x_mm: 0.0
    y_mm: 0.0