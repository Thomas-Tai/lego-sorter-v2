# Bin Layout Configuration for LEGO Sorter V2
# MVP: 2×4 grid + 1 overflow bin (9 total)
# Maps to LEGO Spike Essential 45345-1 storage tray compartments

bin_layout:
  version: 1
  
  grid:
    rows: 2
    cols: 4
    bin_width_mm: 70.0
    bin_depth_mm: 50.0
    bin_height_mm: 35.0
    x_spacing_mm: 5.0    # gap between bins in X
    y_spacing_mm: 5.0    # gap between bins in Y
    x_offset_mm: 55.0    # grid origin X from gantry home
    y_offset_mm: 30.0    # grid origin Y from gantry home

  bins:
    - { id: 0, row: 0, col: 0, label: "Yellow" }
    - { id: 1, row: 0, col: 1, label: "Red" }
    - { id: 2, row: 0, col: 2, label: "Blue" }
    - { id: 3, row: 0, col: 3, label: "Green" }
    - { id: 4, row: 1, col: 0, label: "Orange Large" }
    - { id: 5, row: 1, col: 1, label: "Orange Small" }
    - { id: 6, row: 1, col: 2, label: "Magenta" }
    - { id: 7, row: 1, col: 3, label: "Grey/Black" }

  overflow:
    id: 8
    x_mm: 280.0
    y_mm: 140.0
    label: "Overflow / Unknown"

  # Confidence threshold below which a classified part is routed to the
  # overflow bin instead of its resolved bin. Value matches the legacy
  # hardcoded CONFIDENCE_THRESHOLD constant (sorter_app/main.py,
  # scripts/e2e_sort_simulation.py) -- moving it here does not change
  # runtime behavior. See BinLayoutConfig.confidence_threshold /
  # BinMapper.confidence_threshold (sorter_app/domain/schemas.py,
  # sorter_app/domain/bin_mapper.py).
  confidence_threshold: 0.80

  # Runtime mapping: BinMapper.get_bin_for_part() looks up
  #   exact_key    = f"{part_id}_{color_id}"
  #   wildcard_key = f"{part_id}_*"   (any color for one specific part_id)
  # There is NO part-wildcard ("*_colorId", any part of one color) in the
  # implemented BinMapper (sorter_app/domain/bin_mapper.py), even though
  # SM-DES-006 SS6.1 describes a color-GROUP strategy for set 45345-1. To
  # faithfully reproduce that color-group intent within the code's real
  # lookup capability, every part_id in the trained 94-class label set
  # (models/part_mapping.json) is cross-producted with each color_id that
  # SM-DES-006 confidently assigns to a bin (models/color_mapping.json,
  # names verified via data/raw/rebrickable_20250917/colors.csv).
  #
  # NOTE: SM-DES-006 SS6.2's own example keys (e.g. "3004:26"->7 for "Black")
  # use a DIFFERENT/stale color-ID namespace than the real classifier -- in
  # models/color_mapping.json, color_id 26 is Magenta, not Black. All color_ids
  # below were re-derived by NAME match against colors.csv, not copied from
  # the doc's illustrative numbers. See sw-2-report.md for the full audit.
  #
  # Bins 4 (Orange large) and 5 (Orange small) are intentionally UNMAPPED:
  # SM-DES-006 splits Orange into a large/small sub-bin by PART SIZE, but
  # gives no algorithmic rule to classify each of the 94 trained part_ids
  # into large vs small from the doc text alone -- inventing a size threshold
  # was avoided per task instructions. Unmapped parts safely fall to overflow.
  assignments:
    # --- Bin 0 (Yellow) / color_id 14 = Yellow ---
    # SM-DES-006 SS2.1 Tray1/Slot0 "Yellow / Bright Yellow pieces"; SS4.2 Bin0 YELLOW
