# Bin Layout Configuration for LEGO Sorter V2
# MVP: 2×4 grid + 1 overflow bin (9 total)
# Maps to LEGO Spike Essential 45345-1 storage tray compartments

bin_layout:
  version: 1
  
  grid:
    rows: 2
    cols: 4
    bin_width_mm: 70.0
    bin_depth_mm: 50.0
    bin_height_mm: 35.0
    x_spacing_mm: 5.0    # gap between bins in X
    y_spacing_mm: 5.0    # gap between bins in Y
    x_offset_mm: 55.0    # grid origin X from gantry home
    y_offset_mm: 30.0    # grid origin Y from gantry home

  bins:
    - { id: 0, row: 0, col: 0, label: "Yellow" }
    - { id: 1, row: 0, col: 1, label: "Red" }
    - { id: 2, row: 0, col: 2, label: "Blue" }
    - { id: 3, row: 0, col: 3, label: "Green" }
    - { id: 4, row: 1, col: 0, label: "Orange Large" }
    - { id: 5, row: 1, col: 1, label: "Orange Small" }
    - { id: 6, row: 1, col: 2, label: "Magenta" }
    - { id: 7, row: 1, col: 3, label: "Grey/Black" }

  overflow:
    id: 8
    x_mm: 280.0
    y_mm: 140.0
    label: "Overflow / Unknown"

  # Runtime mapping: { "partId_colorId": bin_id }
  # Format: "partId_colorId" → bin_id
  # Unassigned parts → overflow bin (id: 8)
  # Example entries (to be populated with actual part mappings):
  #   "3004_24": 0    # Brick 1x2, Yellow → Bin 0
  #   "3004_21": 1    # Brick 1x2, Red → Bin 1
  assignments: {}