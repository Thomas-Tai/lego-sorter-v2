; PlatformIO Project Configuration File
; LEGO Sorter V2 - ESP32 Firmware
; Document: SM-DES-007 Motion Control Design

[platformio]
; pio run builds only the device firmware; the native env is test-only
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM=0
lib_deps =
build_type = release

; Native environment for unit tests (requires gcc/g++ on PATH; runs in CI)
; Run: pio test -e native
; test/stubs/ provides an Arduino.h shim plus StepperDriver and
; EndstopManager fakes so the pure-logic modules build without the ESP32
; Arduino core.
[env:native]
platform = native
build_flags = -std=c++17 -Itest/stubs
build_src_filter =
    +<protocol.cpp>
    +<scurve.cpp>
    +<motion_planner.cpp>
    +<homing.cpp>
    +<../test/stubs/stepper_stub.cpp>
    +<../test/stubs/endstop_stub.cpp>
test_build_src = true